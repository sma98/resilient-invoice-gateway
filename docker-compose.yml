services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mock-erp:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./harness:/app
    command: sh -c "pip install --no-cache-dir fastapi uvicorn requests && uvicorn mock_erp:app --host 0.0.0.0 --port 9100"
    ports:
      - "9100:9100"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=./invoices.db
      - ERP_URL=http://mock-erp:9100/erp/purchase-orders/match
    depends_on:
      - redis
      - mock-erp